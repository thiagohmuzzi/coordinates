name: build-windows-exe
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exe with Windows PyInstaller container
        uses: addnab/docker-run-action@v3
        with:
          image: cdrx/pyinstaller-windows
          options: -v ${{ github.workspace }}:/src
          run: pyinstaller --onefile --clean --name kmz2coords_toronto /src/kmz2coords_toronto.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmz2coords_toronto.exe
          path: dist/kmz2coords_toronto.exe
